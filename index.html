<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Route Planner</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIINfQ3g8M6g6jv0nY6b6q5X5b5f5f5f5f5="
    crossorigin=""
  >
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <header class="hero">
      <div>
        <p class="eyebrow">BTech / UG Small-Scale Project</p>
        <h1>Weather Route Planner</h1>
        <p class="subtitle">
          Select a destination and analyse the route using current weather data.
        </p>
      </div>
    </header>

    <section class="controls card">
      <div class="field">
        <label for="start">Starting Location</label>
        <select id="start"></select>
      </div>

      <div class="field">
        <label for="destination">Destination</label>
        <select id="destination"></select>
      </div>

      <button id="analyseBtn" class="primary-btn">Analyse Route</button>
    </section>

    <section id="status" class="status hidden"></section>

    <section class="map-card card">
      <div id="map"></div>
    </section>

    <section id="result" class="result-grid hidden">
      <div class="card summary-card">
        <div class="section-title">
          <h2>Route Analysis</h2>
          <span id="routeBadge" class="badge">—</span>
        </div>

        <div class="stats">
          <div class="stat">
            <span>Distance</span>
            <strong id="distanceValue">—</strong>
          </div>
          <div class="stat">
            <span>Average temperature</span>
            <strong id="temperatureValue">—</strong>
          </div>
          <div class="stat">
            <span>Rain risk</span>
            <strong id="rainValue">—</strong>
          </div>
          <div class="stat">
            <span>Areas checked</span>
            <strong id="areasValue">—</strong>
          </div>
        </div>

        <div id="advice" class="advice"></div>
      </div>

      <div class="card weather-card">
        <h2>Weather Along Route</h2>
        <div id="weatherList"></div>
      </div>
    </section>

    <footer>
      <p>
        Weather data: Open-Meteo. Map data: OpenStreetMap contributors.
      </p>
    </footer>
  </main>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="script.js"></script>
</body>
</html>
